name: Quality Gate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code
    env:
      UV_DEFAULT_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
      VULNWEAVER_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://vulnweaver:vulnweaver_dev_only@127.0.0.1:5432/postgres
      VULNWEAVER_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vulnweaver
          POSTGRES_PASSWORD: vulnweaver_dev_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vulnweaver -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install workspace tools from domestic mirrors
        run: |
          python -m pip install --disable-pip-version-check "uv==0.10.0"
          npm install --global "pnpm@11.10.0"

      - name: Verify locks and install dependencies
        run: |
          uv lock --check
          uv sync --frozen
          pnpm install --frozen-lockfile

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Pyright
        run: pnpm run check:pyright

      - name: pytest
        run: pnpm run check:pytest

      - name: TypeScript workspace
        run: pnpm run check:typescript
