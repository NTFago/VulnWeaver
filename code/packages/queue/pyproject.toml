[project]
name = "vulnweaver-queue"
version = "0.1.0"
description = "Redis Streams transport primitives for VulnWeaver"
requires-python = ">=3.12,<3.13"
dependencies = [
    "redis>=6.4,<9",
    "vulnweaver-contracts",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
vulnweaver-contracts = { workspace = true }

[tool.uv.build-backend]
module-name = "vulnweaver_queue"
