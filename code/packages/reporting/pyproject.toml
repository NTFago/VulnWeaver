[project]
name = "vulnweaver-reporting"
version = "0.1.0"
description = "SARIF and audit report generation for VulnWeaver"
requires-python = ">=3.12,<3.13"
dependencies = ["vulnweaver-contracts", "weasyprint>=68,<69"]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
vulnweaver-contracts = { workspace = true }

[tool.uv.build-backend]
module-name = "vulnweaver_reporting"
