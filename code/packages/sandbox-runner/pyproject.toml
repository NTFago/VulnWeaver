[project]
name = "vulnweaver-sandbox-runner"
version = "0.1.0"
description = "Policy-bound isolated runtime for VulnWeaver dynamic verification"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vulnweaver-artifact-store",
    "vulnweaver-contracts",
    "vulnweaver-tool-runtime",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
vulnweaver-artifact-store = { workspace = true }
vulnweaver-contracts = { workspace = true }
vulnweaver-tool-runtime = { workspace = true }

[tool.uv.build-backend]
module-name = "vulnweaver_sandbox_runner"
