[project]
name = "vulnweaver-proof"
version = "0.1.0"
description = "Policy-gated proof and exploit orchestration for VulnWeaver"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vulnweaver-contracts",
    "vulnweaver-domain",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
vulnweaver-contracts = { workspace = true }
vulnweaver-domain = { workspace = true }

[tool.uv.build-backend]
module-name = "vulnweaver_proof"
