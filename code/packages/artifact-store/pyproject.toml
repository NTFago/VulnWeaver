[project]
name = "vulnweaver-artifact-store"
version = "0.1.0"
description = "Immutable content-addressed artifact storage for VulnWeaver"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vulnweaver-contracts",
    "vulnweaver-persistence",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
vulnweaver-contracts = { workspace = true }
vulnweaver-persistence = { workspace = true }

[tool.uv.build-backend]
module-name = "vulnweaver_artifact_store"
