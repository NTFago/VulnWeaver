[project]
name = "vulnweaver-model-gateway"
version = "0.1.0"
description = "OpenAI-compatible model access and AgentRun recording for VulnWeaver"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "vulnweaver-contracts",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
vulnweaver-contracts = { workspace = true }

[tool.uv.build-backend]
module-name = "vulnweaver_model_gateway"
