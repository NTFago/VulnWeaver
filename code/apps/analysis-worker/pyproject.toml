[project]
name = "vulnweaver-analysis-worker"
version = "0.1.0"
description = "Source import Worker for VulnWeaver"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vulnweaver-artifact-store",
    "vulnweaver-persistence",
    "vulnweaver-queue",
    "vulnweaver-source-analysis",
    "vulnweaver-worker",
]

[project.scripts]
vulnweaver-analysis-worker = "vulnweaver_analysis_worker.main:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
vulnweaver-artifact-store = { workspace = true }
vulnweaver-persistence = { workspace = true }
vulnweaver-queue = { workspace = true }
vulnweaver-source-analysis = { workspace = true }
vulnweaver-worker = { workspace = true }

[tool.uv.build-backend]
module-name = "vulnweaver_analysis_worker"
