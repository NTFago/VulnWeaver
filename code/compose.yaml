name: vulnweaver

services:
  proof-tool:
    image: vulnweaver-proof:fixed
    build:
      context: .
      dockerfile: apps/proof-tool/Dockerfile
    profiles: [tools]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulnweaver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnweaver_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-vulnweaver}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-vulnweaver} -d ${POSTGRES_DB:-vulnweaver}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - control-plane
      - analysis-plane
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    volumes:
      - redis-data:/data
    networks:
      - control-plane
      - analysis-plane
    restart: unless-stopped

  migrate:
    image: vulnweaver-dispatcher:dev
    build:
      context: .
      dockerfile: apps/dispatcher/Dockerfile
      args:
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    command: ["vulnweaver-migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://vulnweaver:vulnweaver_dev_only@postgres:5432/vulnweaver}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - control-plane
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  dispatcher:
    image: vulnweaver-dispatcher:dev
    build:
      context: .
      dockerfile: apps/dispatcher/Dockerfile
      args:
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://vulnweaver:vulnweaver_dev_only@postgres:5432/vulnweaver}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_STREAM_NAMESPACE: ${REDIS_STREAM_NAMESPACE:-vulnweaver}
      DISPATCHER_BATCH_SIZE: ${DISPATCHER_BATCH_SIZE:-100}
      DISPATCHER_POLL_INTERVAL_SECONDS: ${DISPATCHER_POLL_INTERVAL_SECONDS:-0.5}
      DISPATCHER_RETRY_BASE_SECONDS: ${DISPATCHER_RETRY_BASE_SECONDS:-1.0}
      DISPATCHER_RETRY_MAX_SECONDS: ${DISPATCHER_RETRY_MAX_SECONDS:-300.0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - control-plane
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    image: vulnweaver-api:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://vulnweaver:vulnweaver_dev_only@postgres:5432/vulnweaver}
      ARTIFACT_STORE_ROOT: /var/lib/vulnweaver/artifacts
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-536870912}
      MAX_UPLOAD_CONCURRENCY: ${MAX_UPLOAD_CONCURRENCY:-2}
      JSON_BODY_MAX_BYTES: ${JSON_BODY_MAX_BYTES:-1048576}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      LOGIN_FAILURE_THRESHOLD: ${LOGIN_FAILURE_THRESHOLD:-5}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-300}
      MAX_PASSWORD_CONCURRENCY: ${MAX_PASSWORD_CONCURRENCY:-2}
      MAX_ACTIVE_SESSIONS: ${MAX_ACTIVE_SESSIONS:-8}
      SECURE_COOKIE: ${SECURE_COOKIE:-true}
    volumes:
      - artifact-data:/var/lib/vulnweaver/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - control-plane
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  orchestrator:
    image: vulnweaver-orchestrator:dev
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
      args:
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://vulnweaver:vulnweaver_dev_only@postgres:5432/vulnweaver}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_STREAM_NAMESPACE: ${REDIS_STREAM_NAMESPACE:-vulnweaver}
      TOOL_SPEC_DIRECTORY: /etc/vulnweaver/tool-specs
      ORCHESTRATOR_CONSUMER_NAME: ${ORCHESTRATOR_CONSUMER_NAME:-orchestrator-1}
      ORCHESTRATOR_CONSUMER_GROUP: ${ORCHESTRATOR_CONSUMER_GROUP:-orchestrators}
      ORCHESTRATOR_READ_BLOCK_MILLISECONDS: ${ORCHESTRATOR_READ_BLOCK_MILLISECONDS:-1000}
      ORCHESTRATOR_PENDING_IDLE_MILLISECONDS: ${ORCHESTRATOR_PENDING_IDLE_MILLISECONDS:-30000}
    volumes:
      - ./deploy/tool-specs:/etc/vulnweaver/tool-specs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - control-plane
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  analysis-worker:
    image: vulnweaver-analysis-worker:dev
    build:
      context: .
      dockerfile: apps/analysis-worker/Dockerfile
      args:
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://vulnweaver:vulnweaver_dev_only@postgres:5432/vulnweaver}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_STREAM_NAMESPACE: ${REDIS_STREAM_NAMESPACE:-vulnweaver}
      ARTIFACT_STORE_ROOT: /var/lib/vulnweaver/artifacts
      TOOL_SPEC_DIRECTORY: /etc/vulnweaver/tool-specs
      WORKER_CONSUMER_NAME: ${ANALYSIS_WORKER_CONSUMER_NAME:-analysis-worker-1}
      WORKER_CONSUMER_GROUP: ${ANALYSIS_WORKER_CONSUMER_GROUP:-analysis-workers}
      WORKER_CONCURRENCY: ${ANALYSIS_WORKER_CONCURRENCY:-1}
      WORKER_LEASE_SECONDS: ${ANALYSIS_WORKER_LEASE_SECONDS:-120}
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${ANALYSIS_WORKER_HEARTBEAT_INTERVAL_SECONDS:-30}
      REVIEW_MODEL_PROXY_URL: ${REVIEW_MODEL_PROXY_URL:-}
      REPORT_TOOL_VERSION: ${REPORT_TOOL_VERSION:-1.0.0}
      SANDBOX_RUNNER_URL: ${SANDBOX_RUNNER_URL:-http://sandbox-runner:8080}
      SANDBOX_RUNNER_TIMEOUT_SECONDS: ${SANDBOX_RUNNER_TIMEOUT_SECONDS:-60}
      PROOF_TOOL_NAME: ${PROOF_TOOL_NAME:-proof-tool}
      PROOF_TOOL_VERSION: ${PROOF_TOOL_VERSION:-1.0.0}
      DIE_EXECUTABLE: ${DIE_EXECUTABLE:-diec}
      OBJDUMP_EXECUTABLE: ${OBJDUMP_EXECUTABLE:-objdump}
      UPX_EXECUTABLE: ${UPX_EXECUTABLE:-upx}
      GHIDRA_HEADLESS_EXECUTABLE: ${GHIDRA_HEADLESS_EXECUTABLE:-}
      BINARY_TOOLS_IMAGE_DIGEST: ${BINARY_TOOLS_IMAGE_DIGEST:-}
      GHIDRA_SCRIPT_DIRECTORY: /opt/vulnweaver/ghidra
      ANGR_ENABLED: ${ANGR_ENABLED:-false}
    volumes:
      - artifact-data:/var/lib/vulnweaver/artifacts
      - ./deploy/tool-specs:/etc/vulnweaver/tool-specs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - analysis-plane
      - model-egress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  sandbox-runner:
    image: vulnweaver-sandbox-runner:dev
    build:
      context: .
      dockerfile: apps/sandbox-runner/Dockerfile
      args:
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
    environment:
      ARTIFACT_STORE_ROOT: /var/lib/vulnweaver/artifacts
      TOOL_SPEC_DIRECTORY: /etc/vulnweaver/tool-specs
      SANDBOX_ROOT: /var/lib/vulnweaver/sandbox
      DOCKER_HOST_SANDBOX_ROOT: ${DOCKER_HOST_SANDBOX_ROOT:-/var/lib/docker/volumes/${COMPOSE_PROJECT_NAME:-vulnweaver}_sandbox-runtime/_data}
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
      BINARY_TOOLS_IMAGE_REF: ${BINARY_TOOLS_IMAGE_REF:-vulnweaver-binary-tools:fixed}
      BINARY_TOOLS_IMAGE_DIGEST: ${BINARY_TOOLS_IMAGE_DIGEST:-}
      AFL_CASR_IMAGE_REF: ${AFL_CASR_IMAGE_REF:-vulnweaver-afl-casr:fixed}
      AFL_CASR_IMAGE_DIGEST: ${AFL_CASR_IMAGE_DIGEST:-}
      PROOF_IMAGE_REF: ${PROOF_IMAGE_REF:-vulnweaver-proof:fixed}
      PROOF_IMAGE_DIGEST: ${PROOF_IMAGE_DIGEST:-}
    volumes:
      - artifact-data:/var/lib/vulnweaver/artifacts
      - sandbox-runtime:/var/lib/vulnweaver/sandbox
      - ./deploy/tool-specs:/etc/vulnweaver/tool-specs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      binary-tools:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    networks:
      - analysis-plane
    restart: unless-stopped

  binary-tools:
    image: vulnweaver-binary-tools:fixed
    build:
      context: .
      dockerfile: apps/binary-tools/Dockerfile
      args:
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    networks: []
    restart: unless-stopped

  web:
    image: vulnweaver-web:dev
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
    depends_on:
      - api
    networks:
      - control-plane
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  control-plane:
    driver: bridge
  analysis-plane:
    driver: bridge
    internal: true
  model-egress:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  artifact-data:
  sandbox-runtime:
