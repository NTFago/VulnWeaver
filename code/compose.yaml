name: vulnweaver

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulnweaver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnweaver_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-vulnweaver}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-vulnweaver} -d ${POSTGRES_DB:-vulnweaver}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - control-plane
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    volumes:
      - redis-data:/data
    networks:
      - control-plane
    restart: unless-stopped

  migrate:
    image: vulnweaver-dispatcher:dev
    build:
      context: .
      dockerfile: apps/dispatcher/Dockerfile
      args:
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    command: ["vulnweaver-migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://vulnweaver:vulnweaver_dev_only@postgres:5432/vulnweaver}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - control-plane
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  dispatcher:
    image: vulnweaver-dispatcher:dev
    build:
      context: .
      dockerfile: apps/dispatcher/Dockerfile
      args:
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://vulnweaver:vulnweaver_dev_only@postgres:5432/vulnweaver}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_STREAM_NAMESPACE: ${REDIS_STREAM_NAMESPACE:-vulnweaver}
      DISPATCHER_BATCH_SIZE: ${DISPATCHER_BATCH_SIZE:-100}
      DISPATCHER_POLL_INTERVAL_SECONDS: ${DISPATCHER_POLL_INTERVAL_SECONDS:-0.5}
      DISPATCHER_RETRY_BASE_SECONDS: ${DISPATCHER_RETRY_BASE_SECONDS:-1.0}
      DISPATCHER_RETRY_MAX_SECONDS: ${DISPATCHER_RETRY_MAX_SECONDS:-300.0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - control-plane
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    image: vulnweaver-api:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://vulnweaver:vulnweaver_dev_only@postgres:5432/vulnweaver}
      PERSONAL_USERNAME: ${PERSONAL_USERNAME:-owner}
      PERSONAL_PASSWORD_FILE: ${PERSONAL_PASSWORD_FILE:-/run/secrets/vulnweaver_personal_password}
      ARTIFACT_STORE_ROOT: /var/lib/vulnweaver/artifacts
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-536870912}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      SECURE_COOKIE: ${SECURE_COOKIE:-true}
    secrets:
      - vulnweaver_personal_password
    volumes:
      - artifact-data:/var/lib/vulnweaver/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - control-plane
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  control-plane:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  artifact-data:

secrets:
  vulnweaver_personal_password:
    file: ${PERSONAL_PASSWORD_FILE_HOST:-./secrets/personal_password.txt}
