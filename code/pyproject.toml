[project]
name = "vulnweaver-workspace"
version = "0.1.0"
description = "Evidence-driven agentic vulnerability discovery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vulnweaver-artifact-store",
    "vulnweaver-api",
    "vulnweaver-analysis-worker",
    "vulnweaver-binary-analysis",
    "vulnweaver-contracts",
    "vulnweaver-dispatcher",
    "vulnweaver-domain",
    "vulnweaver-pair",
    "vulnweaver-persistence",
    "vulnweaver-model-gateway",
    "vulnweaver-orchestrator",
    "vulnweaver-orchestrator-service",
    "vulnweaver-queue",
    "vulnweaver-source-analysis",
    "vulnweaver-sandbox-runner",
    "vulnweaver-fuzzing",
    "vulnweaver-proof",
    "vulnweaver-reporting",
    "vulnweaver-tool-runtime",
    "vulnweaver-worker",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-jsonschema>=4.23,<5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/analysis-worker",
    "apps/dispatcher",
    "apps/orchestrator",
    "packages/artifact-store",
    "packages/binary-analysis",
    "packages/contracts",
    "packages/domain",
    "packages/pair",
    "packages/persistence",
    "packages/model-gateway",
    "packages/orchestrator",
    "packages/queue",
    "packages/source-analysis",
    "packages/sandbox-runner",
    "packages/fuzzing",
    "packages/proof",
    "packages/reporting",
    "packages/tool-runtime",
    "packages/worker",
]

[tool.uv.sources]
vulnweaver-contracts = { workspace = true }
vulnweaver-api = { workspace = true }
vulnweaver-analysis-worker = { workspace = true }
vulnweaver-binary-analysis = { workspace = true }
vulnweaver-domain = { workspace = true }
vulnweaver-pair = { workspace = true }
vulnweaver-persistence = { workspace = true }
vulnweaver-model-gateway = { workspace = true }
vulnweaver-orchestrator = { workspace = true }
vulnweaver-orchestrator-service = { workspace = true }
vulnweaver-artifact-store = { workspace = true }
vulnweaver-dispatcher = { workspace = true }
vulnweaver-queue = { workspace = true }
vulnweaver-source-analysis = { workspace = true }
vulnweaver-sandbox-runner = { workspace = true }
vulnweaver-fuzzing = { workspace = true }
vulnweaver-proof = { workspace = true }
vulnweaver-reporting = { workspace = true }
vulnweaver-tool-runtime = { workspace = true }
vulnweaver-worker = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["apps", "packages"]
exclude = ["**/__pycache__", "**/.venv", "**/node_modules"]
extraPaths = [
    "apps/api/src",
    "apps/analysis-worker/src",
    "apps/dispatcher/src",
    "apps/orchestrator/src",
    "packages/artifact-store/src",
    "packages/binary-analysis/src",
    "packages/contracts/src",
    "packages/domain/src",
    "packages/persistence/src",
    "packages/model-gateway/src",
    "packages/pair/src",
    "packages/orchestrator/src",
    "packages/queue/src",
    "packages/source-analysis/src",
    "packages/sandbox-runner/src",
    "packages/fuzzing/src",
    "packages/proof/src",
    "packages/reporting/src",
    "packages/tool-runtime/src",
    "packages/worker/src",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
concurrency = ["thread"]
source_pkgs = [
    "vulnweaver_api",
    "vulnweaver_analysis_worker",
    "vulnweaver_artifact_store",
    "vulnweaver_binary_analysis",
    "vulnweaver_contracts",
    "vulnweaver_dispatcher",
    "vulnweaver_domain",
    "vulnweaver_persistence",
    "vulnweaver_model_gateway",
    "vulnweaver_pair",
    "vulnweaver_orchestrator",
    "vulnweaver_queue",
    "vulnweaver_source_analysis",
    "vulnweaver_sandbox_runner",
    "vulnweaver_fuzzing",
    "vulnweaver_tool_runtime",
    "vulnweaver_worker",
]
omit = [
    "*/vulnweaver_api/main.py",
    "*/vulnweaver_analysis_worker/main.py",
    "*/vulnweaver_dispatcher/main.py",
    "*/vulnweaver_dispatcher/migrate.py",
    "*/vulnweaver_orchestrator_service/main.py",
    "*/vulnweaver_persistence/alembic/env.py",
    "*/vulnweaver_persistence/alembic/versions/*.py",
]
