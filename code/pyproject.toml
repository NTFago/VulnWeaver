[project]
name = "vulnweaver-workspace"
version = "0.1.0"
description = "Evidence-driven agentic vulnerability discovery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vulnweaver-artifact-store",
    "vulnweaver-api",
    "vulnweaver-contracts",
    "vulnweaver-dispatcher",
    "vulnweaver-domain",
    "vulnweaver-persistence",
    "vulnweaver-queue",
    "vulnweaver-worker",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-jsonschema>=4.23,<5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/dispatcher",
    "packages/artifact-store",
    "packages/contracts",
    "packages/domain",
    "packages/persistence",
    "packages/queue",
    "packages/worker",
]

[tool.uv.sources]
vulnweaver-contracts = { workspace = true }
vulnweaver-api = { workspace = true }
vulnweaver-domain = { workspace = true }
vulnweaver-persistence = { workspace = true }
vulnweaver-artifact-store = { workspace = true }
vulnweaver-dispatcher = { workspace = true }
vulnweaver-queue = { workspace = true }
vulnweaver-worker = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["apps", "packages"]
exclude = ["**/__pycache__", "**/.venv", "**/node_modules"]
extraPaths = [
    "apps/api/src",
    "apps/dispatcher/src",
    "packages/artifact-store/src",
    "packages/contracts/src",
    "packages/domain/src",
    "packages/persistence/src",
    "packages/queue/src",
    "packages/worker/src",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
concurrency = ["thread"]
source_pkgs = [
    "vulnweaver_api",
    "vulnweaver_artifact_store",
    "vulnweaver_contracts",
    "vulnweaver_dispatcher",
    "vulnweaver_domain",
    "vulnweaver_persistence",
    "vulnweaver_queue",
    "vulnweaver_worker",
]
omit = [
    "*/vulnweaver_api/main.py",
    "*/vulnweaver_dispatcher/main.py",
    "*/vulnweaver_dispatcher/migrate.py",
    "*/vulnweaver_persistence/alembic/env.py",
    "*/vulnweaver_persistence/alembic/versions/*.py",
]
